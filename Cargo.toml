[package]
name = "gemini_bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "gemini_bridge"
path = "src/main.rs"

[dependencies]
# Web Framework
actix-web = "4.15"
actix-rt = "2.11"

# Async Runtime
tokio = { version = "1.43", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP Client
reqwest = { version = "0.12", features = ["json"] }

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "ansi"] }
tracing-actix-web = "0.7"

# Environment Variables
dotenv = "0.15"
once_cell = "1.20"

# UUID Generation
uuid = { version = "1.11", features = ["v4", "serde"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# Utilities
futures = "0.3"
parking_lot = "0.12"
regex = "1.11"
strum = { version = "0.26", features = ["derive"] }
bytes = "1.8"
pin-project = "1.1"

[dev-dependencies]
mockito = "1.5"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3
