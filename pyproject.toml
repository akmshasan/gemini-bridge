[project]
name = "agent-gateway"
version = "0.1.0"
description = "AI / LLM Agent Gateway & RAG Service powered by Google Gemini and FastAPI"
readme = "README.md"
authors = [{ name = "A K M Shafiul Hasan", email = "akmshasan@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
agent-gateway = "agent_gateway:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.8",
    "httpx2>=2.13.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["migrations", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["PLR0913", "PLR0917", "CPY001", "D100", "D104", "S104", "COM812", "D203", "D213"]

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning",
]

